<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Booki Background Worlds</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#26354d;font-family:Arial,sans-serif}
    main{display:grid;grid-template-columns:repeat(5,270px);gap:18px;padding:28px;width:max-content}
    article{position:relative;width:270px;height:480px;overflow:hidden;border-radius:30px;background-position:center;background-size:cover;box-shadow:0 18px 40px #1118}
    article::after{content:"";position:absolute;left:50%;bottom:68px;width:145px;height:28px;translate:-50% 0;border-radius:50%;background:#26354d18;filter:blur(9px)}
    img{position:absolute;z-index:1;left:50%;bottom:64px;width:190px;height:265px;translate:-50% 0;object-fit:contain;filter:drop-shadow(0 9px 9px #26354d18)}
    h2{position:absolute;z-index:2;right:20px;top:15px;margin:0;padding:8px 13px;border-radius:999px;color:#26354d;background:#fff9;font-size:16px;backdrop-filter:blur(8px)}
    .home{background-image:url("./backgrounds/booki-bg-home.svg")}
    .reading{background-image:url("./backgrounds/booki-bg-reading.svg")}
    .classroom{background-image:url("./backgrounds/booki-bg-class.svg")}
    .shop{background-image:url("./backgrounds/booki-bg-shop.svg")}
    .teacher{background-image:url("./backgrounds/booki-bg-teacher.svg")}
    .teacher img{width:150px}
  </style>
</head>
<body>
  <main>
    <article class="home"><h2>בית</h2><img src="../booki-brand-kit/core/states/booki-welcome.png" alt=""></article>
    <article class="reading"><h2>קריאה</h2><img src="../booki-brand-kit/reading-journey/booki-read-in-app.png" alt=""></article>
    <article class="classroom"><h2>כיתה ויעד</h2><img src="../booki-brand-kit/class-goal/booki-progress.png" alt=""></article>
    <article class="shop"><h2>חנות והצבעה</h2><img src="../booki-brand-kit/shop-voting/booki-shop-open.png" alt=""></article>
    <article class="teacher"><h2>צד המורה</h2><img src="../booki-brand-kit/teacher/booki-teacher-helper.png" alt=""></article>
  </main>
</body>
</html>
