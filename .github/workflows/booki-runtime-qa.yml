name: Booki Runtime QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Runtime JavaScript syntax + dependency check
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const fail = msg => { throw new Error(msg); };
          const localPath = src => src.split('?')[0].replace(/^\.\//, '');
          const isLocalJs = src => !!src && /^[A-Za-z0-9_./-]+\.js(?:\?[^\s"']+)?$/.test(src) && !/^(https?:)?\/\//.test(src);
          const exists = p => fs.existsSync(path.join(process.cwd(), p));
          const runtime = new Set();

          const add = src => {
            if (!isLocalJs(src)) return;
            const p = localPath(src);
            if (!exists(p)) fail(`runtime references missing script: ${src}`);
            runtime.add(p);
          };

          const index = fs.readFileSync('index.html', 'utf8');
          for (const m of index.matchAll(/<script[^>]+src=["']([^"']+)["']/g)) add(m[1]);

          const queue = [...runtime];
          const visited = new Set();
          while (queue.length) {
            const file = queue.shift();
            if (visited.has(file)) continue;
            visited.add(file);
            const text = fs.readFileSync(file, 'utf8');
            for (const m of text.matchAll(/["']([^"']+\.js(?:\?[^"']*)?)["']/g)) {
              const p = localPath(m[1]);
              const before = runtime.size;
              add(m[1]);
              if (runtime.size > before && !visited.has(p)) queue.push(p);
            }
          }

          if (!runtime.has('routing.js')) fail('routing.js is not in runtime graph');
          if (!runtime.has('script.js')) fail('script.js is not in runtime graph');
          if (!runtime.has('pilot-loader-2026-09-10.js')) fail('pilot loader is not in runtime graph');
          if (runtime.has('pilot-manual-name-slot-2026-09-11.js')) fail('broken manual-name slot module is active in runtime graph');

          for (const file of [...runtime].sort()) {
            try { cp.execFileSync(process.execPath, ['--check', file], {stdio:'pipe'}); }
            catch (e) {
              process.stderr.write(e.stdout || '');
              process.stderr.write(e.stderr || '');
              fail(`syntax error in runtime file: ${file}`);
            }
          }

          if (!index.includes('id="screen-teacher-boot"')) fail('neutral boot screen missing from index');
          const routing = fs.readFileSync('routing.js', 'utf8');
          if (!routing.includes('async function routeOnLoad()')) fail('routeOnLoad missing');
          const script = fs.readFileSync('script.js', 'utf8');
          if (!script.includes("document.addEventListener('DOMContentLoaded', async () =>")) fail('main DOMContentLoaded bootstrap missing');
          if (!script.includes("if (typeof routeOnLoad === 'function') routeOnLoad();")) fail('bootstrap does not route after auth state');

          console.log(`Runtime JS files checked: ${runtime.size}`);
          console.log('Runtime syntax + dependency integrity: OK');
          NODE

      - name: Static server smoke check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/booki-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8080/index.html >/tmp/booki-index.html
          grep -q 'id="screen-teacher-boot"' /tmp/booki-index.html
          grep -q 'routing.js' /tmp/booki-index.html
          echo 'Static server smoke check: OK'

      - name: Install browser controller
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24

      - name: Controlled browser boot check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8081 --bind 127.0.0.1 >/tmp/booki-browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          export BOOKI_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BOOKI_CHROME" ]; then
            echo 'No Chrome/Chromium binary on runner.'
            exit 1
          fi
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const errors = [];
          const consoleLines = [];
          const failedRequests = [];
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.BOOKI_CHROME,
              headless: true,
              args: ['--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--no-first-run','--no-default-browser-check']
            });
            const page = await browser.newPage();
            page.on('pageerror', err => errors.push(String(err.stack || err.message || err)));
            page.on('console', msg => {
              const line = `[${msg.type()}] ${msg.text()}`;
              consoleLines.push(line);
              if (msg.type() === 'error') errors.push(line);
            });
            page.on('requestfailed', req => failedRequests.push(`${req.url()} :: ${req.failure()?.errorText || 'failed'}`));

            try {
              await page.goto('http://127.0.0.1:8081/', {waitUntil:'domcontentloaded', timeout:15000});
              const deadline = Date.now() + 20000;
              let state = null;
              while (Date.now() < deadline) {
                state = await page.evaluate(() => ({
                  readyState: document.readyState,
                  active: [...document.querySelectorAll('.screen.active')].map(el => el.id),
                  bootActive: document.getElementById('screen-teacher-boot')?.classList.contains('active') || false,
                  intro: !!document.getElementById('booki-teacher-intro'),
                  startError: document.getElementById('booki-start-error')?.textContent || '',
                  teacherLogin: document.getElementById('screen-teacher-login')?.classList.contains('active') || false,
                  welcome: document.getElementById('screen-welcome')?.classList.contains('active') || false
                }));
                if (!state.bootActive && state.active.length) break;
                await sleep(250);
              }
              console.log('BOOT_STATE=' + JSON.stringify(state));
              console.log('CONSOLE=' + JSON.stringify(consoleLines.slice(-80)));
              console.log('FAILED_REQUESTS=' + JSON.stringify(failedRequests.slice(-40)));
              if (errors.length) console.log('PAGE_ERRORS=' + JSON.stringify(errors.slice(-40)));
              if (!state || state.bootActive || !state.active.length) {
                throw new Error('Booki stayed on screen-teacher-boot');
              }
              if (state.startError) throw new Error('Booki start error panel appeared: ' + state.startError);
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE
          echo 'Controlled browser boot check: OK'
