name: Booki Runtime QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Runtime JavaScript syntax + dependency check
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const fail = msg => { throw new Error(msg); };
          const localPath = src => src.split('?')[0].replace(/^\.\//, '');
          const isLocalJs = src => !!src && !/^(https?:)?\/\//.test(src) && localPath(src).endsWith('.js');
          const exists = p => fs.existsSync(path.join(process.cwd(), p));
          const runtime = new Set();

          const add = src => {
            if (!isLocalJs(src)) return;
            const p = localPath(src);
            if (!exists(p)) fail(`runtime references missing script: ${src}`);
            runtime.add(p);
          };

          const index = fs.readFileSync('index.html', 'utf8');
          for (const m of index.matchAll(/<script[^>]+src=["']([^"']+)["']/g)) add(m[1]);

          const queue = [...runtime];
          const visited = new Set();
          while (queue.length) {
            const file = queue.shift();
            if (visited.has(file)) continue;
            visited.add(file);
            const text = fs.readFileSync(file, 'utf8');
            for (const m of text.matchAll(/["']([^"']+\.js(?:\?[^"']*)?)["']/g)) {
              const p = localPath(m[1]);
              const before = runtime.size;
              add(m[1]);
              if (runtime.size > before && !visited.has(p)) queue.push(p);
            }
          }

          if (!runtime.has('routing.js')) fail('routing.js is not in runtime graph');
          if (!runtime.has('script.js')) fail('script.js is not in runtime graph');
          if (!runtime.has('pilot-loader-2026-09-10.js')) fail('pilot loader is not in runtime graph');
          if (runtime.has('pilot-manual-name-slot-2026-09-11.js')) fail('broken manual-name slot module is active in runtime graph');

          for (const file of [...runtime].sort()) {
            try { cp.execFileSync(process.execPath, ['--check', file], {stdio:'pipe'}); }
            catch (e) {
              process.stderr.write(e.stdout || '');
              process.stderr.write(e.stderr || '');
              fail(`syntax error in runtime file: ${file}`);
            }
          }

          if (!index.includes('id="screen-teacher-boot"')) fail('neutral boot screen missing from index');
          const routing = fs.readFileSync('routing.js', 'utf8');
          if (!routing.includes('async function routeOnLoad()')) fail('routeOnLoad missing');
          const script = fs.readFileSync('script.js', 'utf8');
          if (!script.includes("document.addEventListener('DOMContentLoaded', async () =>")) fail('main DOMContentLoaded bootstrap missing');
          if (!script.includes("if (typeof routeOnLoad === 'function') routeOnLoad();")) fail('bootstrap does not route after auth state');

          console.log(`Runtime JS files checked: ${runtime.size}`);
          console.log([...runtime].sort().join('\n'));
          console.log('Runtime syntax + dependency integrity: OK');
          NODE

      - name: Static server smoke check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/booki-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8080/index.html >/tmp/booki-index.html
          grep -q 'id="screen-teacher-boot"' /tmp/booki-index.html
          grep -q 'routing.js' /tmp/booki-index.html
          echo 'Static server smoke check: OK'

      - name: Headless browser boot check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8081 --bind 127.0.0.1 >/tmp/booki-browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No Chrome/Chromium binary on runner; runtime syntax + dependency checks already passed.'
            exit 0
          fi
          timeout 45s "$chrome" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8081/ >/tmp/booki-dom.html 2>/tmp/booki-chrome.log || {
            cat /tmp/booki-chrome.log
            exit 1
          }
          python3 <<'PY'
          from html.parser import HTMLParser
          class Screens(HTMLParser):
              def __init__(self):
                  super().__init__(); self.screens=[]
              def handle_starttag(self, tag, attrs):
                  if tag != 'section': return
                  a=dict(attrs); sid=a.get('id',''); classes=a.get('class','').split()
                  if sid.startswith('screen-'): self.screens.append((sid,classes))
          p=Screens(); p.feed(open('/tmp/booki-dom.html',encoding='utf-8').read())
          active=[sid for sid,classes in p.screens if 'active' in classes]
          print('Active screens after boot:', active)
          if active == ['screen-teacher-boot'] or not active:
              print(open('/tmp/booki-chrome.log',encoding='utf-8',errors='ignore').read())
              raise SystemExit('Booki stayed on the neutral boot screen')
          PY
          echo 'Headless browser boot check: OK'
