name: Booki Security
on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/private-library/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests/private-library --ignore-scripts --no-audit --no-fund
      - run: node tests/private-library/device-ui.cjs
      - run: node scripts/test-release-flows.js
      - name: Firestore negative and positive authorization tests
        run: tests/private-library/node_modules/.bin/firebase emulators:exec --only firestore --project demo-booki-private --config firebase.security.json 'node tests/private-library/rules.cjs && node tests/private-library/security.cjs'
