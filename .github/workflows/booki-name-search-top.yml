name: Booki Name Search Placement
on:
  push:
    branches: ['fix/name-search-top-20260918', 'main']
    paths: ['scripts/move-name-search-top.cjs', 'scripts/test-student-cards-browser.py', '.github/workflows/booki-name-search-top.yml', 'student-cards.css', 'index.html']
permissions:
  contents: read
jobs:
  verify-change:
    if: github.ref == 'refs/heads/fix/name-search-top-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/name-search-top-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move existing name search above student cards
        run: node scripts/move-name-search-top.cjs
      - name: Verify existing behavior source is unchanged
        run: |
          git diff --exit-code c82f362da73af8df7f2d5b748b083bf9c339ffd8 -- routing.js script.js teacher-roster.js teacher-flow.js private-library.js firestore.rules content pilot-class-slots-2026-09-11.js pilot-class-slots-hardening-2026-09-11.js pilot-class-slots-safety-2026-09-11.js
          node scripts/test-reading-safety.js
          node scripts/test-omri-word-matcher.js
          node scripts/test-booki-local-listening.js
          node scripts/test-release-flows.js
      - name: Install isolated browser driver
        run: python -m pip install playwright==1.57.0
      - name: Search visible at entry, filtering, identity and roster regressions
        run: |
          export BOOKI_CHROME="$(command -v google-chrome || command -v chromium)"
          python scripts/test-student-cards-browser.py
      - name: Save tested change on fix branch only
        run: |
          git config user.name 'Booki Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html student-cards.css scripts/test-student-cards-browser.py
          if ! git diff --cached --quiet; then
            git commit -m 'Show name search at the top before student cards [cache-bust-done]'
            git push origin HEAD:refs/heads/fix/name-search-top-20260918
          fi
          git rev-parse HEAD > verification/student-cards/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: name-search-top-review
          path: verification/student-cards/
          retention-days: 3
  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published page and search styling match this commit
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          (async()=>{
            for(const file of ['index.html','student-cards.css']){
              const expected=fs.readFileSync(file,'utf8');let text,status;
              for(let i=0;i<20;i++){
                const response=await fetch('https://yehuditamos.github.io/booki/'+(file==='index.html'?'':file)+'?release='+process.env.GITHUB_SHA+'&check='+i,{signal:AbortSignal.timeout(15000)});
                text=await response.text();status=response.status;
                if(status===200&&text===expected)break;
                await new Promise(r=>setTimeout(r,5000));
              }
              assert.equal(status,200,file);assert.equal(text,expected,file+' live source');
              console.log('PASS: deployed '+file+' matches '+process.env.GITHUB_SHA);
            }
            const html=fs.readFileSync('index.html','utf8');
            const screen=html.split('<section id="screen-who-reads"')[1].split('</section>')[0];
            assert(screen.indexOf('class="who-reads-footer"')<screen.indexOf('id="who-reads-grid"'));
            console.log('PASS: name search region precedes student cards in live page. No student data accessed.');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
