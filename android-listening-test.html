<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>בדיקת בוקי לאנדרואיד</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e7;font-family:Arial,sans-serif;color:#26343c;padding:18px}.card{max-width:760px;margin:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 35px #0001}h1{text-align:center;font-size:34px}.sub,.status{text-align:center;font-size:20px;line-height:1.45}.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#faf8f1;border-radius:24px;padding:18px;margin:18px 0}.word{font-size:32px;line-height:1.3;padding:8px 11px;border-radius:14px;transition:.12s}.word.done{background:#ccefd5;color:#12643b}.word.live{background:#eadcff;outline:3px solid #eba63c}button{width:100%;border:0;border-radius:24px;padding:18px;font-size:27px;font-weight:700;background:#eba63c;color:#225ed2;box-shadow:0 8px 0 #c87d1e}button.stop{background:#8f62d6;color:white;box-shadow:0 8px 0 #6b46b0}.ok{color:#7c55d0;font-weight:700}.note{font-size:16px;color:#70777d;text-align:center}</style></head><body><main class="card"><h1>🎙️ בדיקת בוקי באנדרואיד</h1><p class="sub">לפתוח ב־Chrome, ללחוץ ולהקריא ברצף. בוקי מתקדם בצורה סלחנית ולא בוחן הגייה.</p><div id="words" class="words"></div><button id="btn">מתחילים לקרוא</button><p id="status" class="status">מחכים להתחלה</p><p class="note">אין כניסה ואין קוד. הדפדפן יבקש רק אישור מיקרופון — זה הכרחי כדי לשמוע.</p></main><script>const TEXT='בַּבֹּקֶר נֹעַם יָצָא לַגִּנָּה. הוּא רָאָה פַּרְפַּר כָּחֹל עָף מֵעַל הַפְּרָחִים. נֹעַם עָמַד בְּשֶׁקֶט וְחִכָּה שֶׁהַפַּרְפַּר יִתְקָרֵב.';const expected=TEXT.split(/\s+/).filter(Boolean),box=document.getElementById('words'),btn=document.getElementById('btn'),status=document.getElementById('status');let rec=null,running=false,finalText='',done=0;function norm(t){return String(t||'').normalize('NFKD').replace(/[\u0591-\u05C7]/g,'').replace(/["'׳״.,!?;:()\[\]{}־–—/\\]/g,' ').replace(/[^א-ת\s]/g,' ').replace(/\s+/g,' ').trim()}function key(t){return norm(t).replace(/[אהחעוי]/g,'')}function lev(a,b){const r=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let d=r[0];r[0]=i;for(let j=1;j<=b.length;j++){const u=r[j];r[j]=Math.min(r[j]+1,r[j-1]+1,d+(a[i-1]===b[j-1]?0:1));d=u}}return r[b.length]}function similar(a,b){a=key(a);b=key(b);if(!a||!b)return false;if(a===b||a.includes(b)||b.includes(a))return true;return 1-lev(a,b)/Math.max(a.length,b.length)>=.5}function paint(){box.innerHTML='';expected.forEach((w,i)=>{const s=document.createElement('span');s.className='word '+(i<done?'done':i===done&&running?'live':'');s.textContent=w;box.appendChild(s)})}function score(text){const heard=norm(text).split(' ').filter(Boolean);let p=0;for(const h of heard){if(p>=expected.length)break;if(similar(h,expected[p]))p++;else if(p+1<expected.length&&similar(h,expected[p+1]))p+=2}done=Math.max(done,Math.min(p,expected.length));paint();if(done>=expected.length){status.textContent='מושלם! בוקי עקב עד סוף הקטע 🎉';status.className='status ok';stop()}}function makeRec(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status.textContent='לא נמצאה תמיכה. ודאו שנפתח ב־Chrome מעודכן.';return null}const x=new R();x.lang='he-IL';x.continuous=true;x.interimResults=true;x.maxAlternatives=5;x.onstart=()=>{status.textContent='בוקי מקשיב';status.className='status ok'};x.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];const t=r[0]?.transcript||'';if(r.isFinal)finalText+=' '+t;else interim+=' '+t}score(finalText+' '+interim)};x.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')status.textContent='צריך לאשר מיקרופון ל־Chrome.';else if(e.error!=='no-speech'&&e.error!=='aborted')status.textContent='הזיהוי נעצר. לחצו שוב והמשיכו.'};x.onend=()=>{if(running)try{x.start()}catch(_){}};return x}function start(){if(running){stop();return}if(!rec)rec=makeRec();if(!rec)return;running=true;btn.textContent='עוצרים הקשבה';btn.classList.add('stop');paint();try{rec.start()}catch(_){status.textContent='לחצו שוב כדי להתחיל'}}function stop(){running=false;try{rec?.stop()}catch(_){}btn.textContent='מתחילים לקרוא';btn.classList.remove('stop');paint()}btn.onclick=start;paint();</script></body></html>
