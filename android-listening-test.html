<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>בוקי קורא איתי — בדיקת זרימה</title>
  <style>
    :root{
      --bg:#fff8e7;--ink:#29343a;--muted:#747b80;
      --purple:#8d63d5;--green:#35a867;--amber:#ee9f31;--grey:#d9d9d9
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);padding:16px}
    .card{max-width:780px;margin:auto;background:#fff;border-radius:30px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.07);overflow:hidden;position:relative}
    h1{text-align:center;font-size:clamp(31px,7vw,52px);margin:4px 0 8px}
    .sub{text-align:center;color:#626a70;font-size:clamp(17px,3.7vw,24px);line-height:1.45;margin:0 auto 12px;max-width:650px}
    .page-count{width:max-content;margin:0 auto 12px;padding:7px 14px;border-radius:999px;background:#f3effa;color:#6849a9;font-weight:700}
    .listen-meter{height:42px;display:flex;justify-content:center;align-items:flex-end;gap:8px;margin-bottom:12px}
    .listen-meter i{display:block;width:10px;height:18px;border-radius:999px;background:linear-gradient(#c5aaff,var(--purple));transform-origin:center bottom;transition:transform .08s linear,opacity .08s linear;opacity:.55}
    .story{background:#fbfaf5;border-radius:25px;padding:24px 20px;min-height:360px;transition:background .3s ease,transform .3s ease}
    .sentence{font-size:clamp(28px,5.8vw,48px);line-height:1.85;margin:0 0 18px}
    .sentence:last-child{margin-bottom:0}
    .word{position:relative;display:inline-block;isolation:isolate;padding:.03em .08em;border-radius:50%;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;opacity:1!important;visibility:visible!important;transition:color .12s ease,text-shadow .12s ease,filter .12s ease,transform .12s ease;background:transparent}
    .word::before{content:'';position:absolute;z-index:-1;inset:-.09em -.12em;border-radius:999px;opacity:0;pointer-events:none}
    .word.done{color:#176a43!important;-webkit-text-fill-color:#176a43!important;text-shadow:0 0 6px rgba(84,200,126,.72),0 0 15px rgba(108,219,148,.48),0 0 25px rgba(166,239,190,.4)}
    .word.current,.word.start-here{color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;text-shadow:none!important;filter:none!important;transform:none!important}
    .word.current::before,.word.start-here::before{opacity:1;background:rgba(222,205,252,.42);box-shadow:0 0 11px rgba(154,107,225,.5),0 0 24px rgba(187,151,239,.4);animation:startHereGlow .72s ease-in-out infinite alternate}
    .word.retry{color:#8d4b00!important;-webkit-text-fill-color:#8d4b00!important;text-shadow:none;animation:retryGlow .52s ease-in-out 3}
    .word.retry::before{opacity:1;background:rgba(255,225,165,.42);box-shadow:0 0 12px rgba(245,171,69,.68),0 0 25px rgba(255,201,116,.5)}
    .word.helping{color:#4f3186!important;-webkit-text-fill-color:#4f3186!important;text-shadow:none;transform:scale(1.07)}
    .word.helping::before{opacity:1;background:rgba(224,207,255,.48);box-shadow:0 0 14px rgba(142,91,220,.72),0 0 28px rgba(176,135,239,.54)}
    .story.page-complete{background:linear-gradient(145deg,#fff7d6,#f0e5ff,#e4f8e9);animation:pageStep .9s ease-in-out 2}
    .story.page-complete .word{color:#7447b0!important;-webkit-text-fill-color:#7447b0!important;text-shadow:0 0 8px rgba(239,186,67,.8),0 0 19px rgba(173,119,235,.58),0 0 30px rgba(255,224,137,.48);background:transparent;animation:finishGlow .85s ease-in-out infinite alternate}
    .story.page-complete .word::before{opacity:0;animation:none}
    @keyframes startHereGlow{from{opacity:.38;box-shadow:0 0 7px rgba(154,107,225,.34),0 0 16px rgba(187,151,239,.28)}to{opacity:.86;box-shadow:0 0 14px rgba(154,107,225,.62),0 0 30px rgba(187,151,239,.48)}}
    @keyframes retryGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes finishGlow{from{filter:brightness(.98)}to{filter:brightness(1.1)}}
    @keyframes pageStep{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .status{text-align:center;font-size:clamp(20px,4.5vw,30px);line-height:1.4;margin:16px 0 8px;color:var(--muted);min-height:42px}
    .status.ok{color:var(--purple);font-weight:700}.status.fast{color:#1d7f57;font-weight:700}.status.retry-text{color:#af5d00;font-weight:700}
    .celebration{text-align:center;font-size:clamp(27px,6vw,44px);font-weight:900;color:#7648be;display:none;margin:10px 0}.celebration.show{display:block}
    .actions{display:grid;gap:13px;margin-top:15px}
    button{border:0;border-radius:24px;padding:18px;font-family:inherit;font-size:clamp(23px,5vw,34px);font-weight:800;cursor:pointer}
    .listen-btn{background:#eba63c;color:#1f60d3;box-shadow:0 8px 0 #c87c1e}.listen-btn.stop{background:var(--purple);color:#fff;box-shadow:0 8px 0 #6742ae}
    .help-btn{display:none;background:#eee6ff;color:#6545a7;border:3px solid #8d63d5;box-shadow:none}.help-btn.show{display:block}
    .next-btn{background:var(--grey);color:#777;box-shadow:0 8px 0 #bfbfbf}.next-btn.ready{background:var(--purple);color:#fff;box-shadow:0 8px 0 #6742ae}.next-btn:disabled{cursor:not-allowed;opacity:1}
    .reset-btn{background:#ededed;color:#4f585e;font-size:20px;padding:13px;box-shadow:none}
    .note{text-align:center;color:#777;font-size:16px;line-height:1.5;margin:13px 0 0}
    details{margin-top:20px;border-top:1px solid #eee;padding-top:12px;color:#676d71}summary{cursor:pointer;text-align:center;font-weight:700}.debug{font-size:14px;line-height:1.55;background:#f6f6f6;border-radius:14px;padding:12px;margin-top:10px;word-break:break-word}.copy-btn{margin-top:10px;width:100%;padding:11px;font-size:16px;background:#ece6f9;color:#6545a7;box-shadow:none}
    .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}.confetti-piece{position:absolute;top:-24px;width:11px;height:17px;border-radius:3px;animation:fall 1500ms linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(720deg);opacity:.08}}
  </style>
</head>
<body>
<main class="card">
  <div id="confetti" class="confetti"></div>
  <h1>🎙️ בוקי קורא איתי</h1>
  <p class="sub">בוקי עוקב מילה־מילה, אבל מסמן אותה בזוהר עדין כדי שהסיפור ימשיך לזרום.</p>
  <div id="pageCount" class="page-count">עמוד 1 מתוך 2</div>
  <div id="meter" class="listen-meter"><i></i><i></i><i></i><i></i><i></i></div>
  <section id="story" class="story" aria-live="polite"></section>
  <div id="celebration" class="celebration">איזה יופי! סיימת את העמוד 🎉</div>
  <p id="status" class="status">מתחילים מהמילה המהבהבת</p>
  <div class="actions">
    <button id="listenBtn" class="listen-btn">מתחילים לקרוא</button>
    <button id="helpBtn" class="help-btn">בוקי, תעזור לי</button>
    <button id="nextBtn" class="next-btn" disabled>עמוד הבא</button>
    <button id="resetBtn" class="reset-btn">איפוס העמוד</button>
  </div>
  <p class="note">המילה המהבהבת מסמנת מאיפה מתחילים. הזוהר מתקדם איתך מילה־מילה.</p>
  <details><summary>פרטי טסט למבוגר</summary><div id="debug" class="debug">עדיין אין נתוני בדיקה.</div><button id="copyBtn" class="copy-btn" type="button">העתקת תוצאות הטסט</button></details>
</main>
<script>
const PAGES=[
  'בַּבֹּקֶר נֹעַם יָצָא לַגִּנָּה. הוּא רָאָה פַּרְפַּר כָּחֹל עָף מֵעַל הַפְּרָחִים. נֹעַם עָמַד בְּשֶׁקֶט וְחִכָּה שֶׁהַפַּרְפַּר יִתְקָרֵב.',
  'אַחַר כָּךְ נֹעַם חָזַר הַבַּיְתָה. הוּא סִפֵּר לְאִמָּא עַל הַפַּרְפַּר הַכָּחֹל. נֹעַם אָמַר שֶׁמָּחָר יֵצֵא שׁוּב לַגִּנָּה.'
];
const HELP_CHUNKS={'יתקרב':'יִתְ • קָ • רֵב','פרפר':'פַּרְ • פַּר','הפרחים':'הַ • פְּרָ • חִים','בבוקר':'בַּ • בֹּ • קֶר','לגינה':'לַ • גִּ • נָּה'};
const storyEl=document.getElementById('story'),statusEl=document.getElementById('status'),listenBtn=document.getElementById('listenBtn'),helpBtn=document.getElementById('helpBtn'),nextBtn=document.getElementById('nextBtn'),resetBtn=document.getElementById('resetBtn'),celebrationEl=document.getElementById('celebration'),pageCountEl=document.getElementById('pageCount'),debugEl=document.getElementById('debug'),copyBtn=document.getElementById('copyBtn'),meterBars=[...document.querySelectorAll('#meter i')],confettiEl=document.getElementById('confetti');
let pageIndex=0,expected=[],done=0,retryIndex=-1,retries=0,rec=null,running=false,lastAlternatives=[],lastHeard='',retryTimer=null,lastProgressWords=0,stream=null,audioContext=null,analyser=null,meterFrame=null,pageComplete=false;const events=[];
function norm(value){const finals={ך:'כ',ם:'מ',ן:'נ',ף:'פ',ץ:'צ'};return String(value||'').normalize('NFKD').replace(/[\u0591-\u05C7]/g,'').replace(/[ךםןףץ]/g,c=>finals[c]).replace(/["'׳״.,!?;:()\[\]{}־–—/\\]/g,' ').replace(/[^א-ת\s]/g,' ').replace(/\s+/g,' ').trim()}
function phonetic(value){return norm(value).replace(/ע/g,'א').replace(/[חכ]/g,'כ').replace(/[טת]/g,'ת')}
function key(value){return phonetic(value).replace(/[וי]/g,'')}
const PREFIXES=new Set('ובכלמשהאתינ'.split('')),SUFFIXES=['יהם','יכן','יכם','יות','ים','ות','יו','יה','נו','כם','כן','ה','ת','ו','י','ך'];
function variants(value){const base=norm(value).replace(/\s/g,''),out=new Set([base]);let layer=[base];for(let depth=0;depth<2;depth++){const next=[];for(const item of layer){if(item.length>3&&PREFIXES.has(item[0])){const cut=item.slice(1);if(cut.length>=3&&!out.has(cut)){out.add(cut);next.push(cut)}}}layer=next}for(const item of [...out])for(const suffix of SUFFIXES)if(item.endsWith(suffix)&&item.length-suffix.length>=3)out.add(item.slice(0,-suffix.length));return [...out]}
function lev(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let diag=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const prev=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,diag+(a[i-1]===b[j-1]?0:1));diag=prev}}return row[b.length]}
function lcs(a,b){const dp=Array(b.length+1).fill(0);for(const ca of a){let prev=0;for(let j=1;j<=b.length;j++){const temp=dp[j];dp[j]=ca===b[j-1]?prev+1:Math.max(dp[j],dp[j-1]);prev=temp}}return dp[b.length]}
function sameCore(spoken,written){for(const a0 of variants(spoken))for(const b0 of variants(written)){const a=phonetic(a0),b=phonetic(b0),ak=key(a0),bk=key(b0);if(a===b||(ak&&ak===bk))return true;const min=Math.min(ak.length,bk.length),max=Math.max(ak.length,bk.length);if(min<3)continue;const common=lcs(ak,bk),distance=lev(ak,bk);if(min===3){if(common>=2&&distance<=1&&(ak[0]===bk[0]||ak.at(-1)===bk.at(-1)))return true}else if(common>=3&&common/min>=.72&&distance<=Math.max(1,Math.floor(max*.34)))return true}return false}
function sentenceHtml(text){const words=String(text).split(/\s+/).filter(Boolean);return `<p class="sentence">${words.map((word,index)=>`<span class="word${index===0?' start-here':''}" data-index="${index}">${word}</span>`).join(' ')}</p>`}
function renderPage(){expected=PAGES[pageIndex].split(/\s+/).filter(Boolean);done=0;retryIndex=-1;retries=0;lastAlternatives=[];lastHeard='';lastProgressWords=0;pageComplete=false;events.length=0;clearRetryTimer();helpBtn.classList.remove('show');celebrationEl.classList.remove('show');storyEl.classList.remove('page-complete');nextBtn.disabled=true;nextBtn.classList.remove('ready');nextBtn.textContent=pageIndex<PAGES.length-1?'עמוד הבא':'סיימנו 🎉';pageCountEl.textContent=`עמוד ${pageIndex+1} מתוך ${PAGES.length}`;storyEl.innerHTML=sentenceHtml(PAGES[pageIndex]);statusEl.textContent='מתחילים מהמילה המהבהבת';statusEl.className='status';paint();updateDebug();requestAnimationFrame(()=>{const first=wordNodes()[0];if(first){first.classList.add('start-here');first.style.opacity='1';first.style.visibility='visible'}})}
function wordNodes(){return [...storyEl.querySelectorAll('.word')]}
function paint(){wordNodes().forEach((node,index)=>{node.classList.toggle('done',index<done&&!pageComplete);node.classList.toggle('start-here',index===done&&!running&&!pageComplete&&retryIndex!==index);node.classList.toggle('current',index===done&&running&&!pageComplete&&retryIndex!==index);node.classList.toggle('retry',index===retryIndex&&!pageComplete);node.classList.toggle('helping',index===retryIndex&&helpBtn.classList.contains('show')&&!pageComplete);node.style.opacity='1';node.style.visibility='visible'})}
function updateDebug(){const current=done<expected.length?expected[done]:'סיום';debugEl.innerHTML=`<strong>המילה הנוכחית:</strong> ${current}<br><strong>שמעתי לאחרונה:</strong> ${lastHeard||'—'}<br><strong>חלופות:</strong> ${lastAlternatives.join(' | ')||'—'}<br><strong>ניסיונות חוזרים:</strong> ${retries}<br><strong>מילים בקפיצה האחרונה:</strong> ${lastProgressWords}<br><strong>התקדמות:</strong> ${done}/${expected.length}`}
function clearRetryTimer(){if(retryTimer)clearTimeout(retryTimer);retryTimer=null}
function onlyPastWords(value){const heard=norm(value).split(' ').filter(Boolean);if(!heard.length||done===0)return false;const from=Math.max(0,done-6);return heard.every(token=>{for(let i=from;i<done;i++)if(sameCore(token,expected[i]))return true;return false})}
function flashRetry(heard){if(done>=expected.length||pageComplete)return;retries++;retryIndex=done;lastHeard=heard||'לא זוהתה מילה';statusEl.textContent=`נסה שוב: ${expected[done]}`;statusEl.className='status retry-text';if(retries>=2)helpBtn.classList.add('show');events.push({time:new Date().toISOString(),type:'retry',expected:norm(expected[done]),heard:norm(heard),position:done,retries});paint();updateDebug();setTimeout(()=>{if(retryIndex===done&&!helpBtn.classList.contains('show')){retryIndex=-1;paint()}},1800)}
function scheduleRetry(heard){clearRetryTimer();const position=done;retryTimer=setTimeout(()=>{retryTimer=null;if(running&&done===position&&!onlyPastWords(heard))flashRetry(heard)},430)}
function progressAlternative(value,start){const heard=norm(value).split(' ').filter(Boolean);let pointer=start;const matched=[],missed=[];for(const token of heard){if(pointer>=expected.length)break;if(sameCore(token,expected[pointer])){matched.push({heard:token,expected:norm(expected[pointer]),position:pointer});pointer++}else missed.push(token)}return{pointer,matched,missed,heard}}
function bestProgress(alternatives){let best={pointer:done,matched:[],missed:[],heard:[],text:''};for(const text of alternatives){const result=progressAlternative(text,done);if(result.pointer>best.pointer||(result.pointer===best.pointer&&result.missed.length<best.missed.length))best={...result,text}}return best}
function handleResult(alternatives,isFinal){if(pageComplete)return;const before=done,best=bestProgress(alternatives);lastAlternatives=alternatives.map(norm).filter(Boolean);lastHeard=norm(best.text||alternatives[0]||'');if(best.pointer>before){clearRetryTimer();done=best.pointer;lastProgressWords=done-before;retryIndex=-1;retries=0;helpBtn.classList.remove('show');const fast=lastProgressWords>=3;statusEl.textContent=done>=expected.length?'מושלם! סיימת את העמוד 🎉':fast?'בוקי רץ איתך!':'יופי, ממשיכים';statusEl.className=fast?'status fast':'status ok';events.push({time:new Date().toISOString(),type:isFinal?'final-progress':'live-progress',from:before,to:done,heard:lastHeard,matches:best.matched});paint();updateDebug();if(done>=expected.length)completePage();return}updateDebug();if(isFinal&&lastHeard&&!onlyPastWords(lastHeard))scheduleRetry(lastHeard);else if(!isFinal){statusEl.textContent='בוקי איתך בזמן אמת';statusEl.className='status ok'}}
function makeRecognition(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){statusEl.textContent='לא נמצאה תמיכה. ודאו שנפתח ב־Chrome מעודכן.';return null}const recognition=new R();recognition.lang='he-IL';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=10;recognition.onstart=()=>{statusEl.textContent='בוקי מקשיב';statusEl.className='status ok';updateDebug()};recognition.onresult=event=>{for(let i=event.resultIndex;i<event.results.length;i++){const result=event.results[i],alternatives=[];for(let a=0;a<Math.min(result.length,10);a++){const value=String(result[a]?.transcript||'').trim();if(value)alternatives.push(value)}if(alternatives.length)handleResult(alternatives,!!result.isFinal)}};recognition.onerror=event=>{if(event.error==='not-allowed'||event.error==='service-not-allowed')statusEl.textContent='צריך לאשר מיקרופון ל־Chrome.';else if(event.error!=='no-speech'&&event.error!=='aborted')statusEl.textContent='הזיהוי נעצר. לחצו שוב והמשיכו.'};recognition.onend=()=>{if(running&&!pageComplete)try{recognition.start()}catch(_){}};return recognition}
async function startMeter(){if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});audioContext=new(window.AudioContext||window.webkitAudioContext)();const source=audioContext.createMediaStreamSource(stream);analyser=audioContext.createAnalyser();analyser.fftSize=256;source.connect(analyser);meterLoop()}catch(_){}}
function meterLoop(){if(!analyser)return;const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);const average=data.reduce((sum,value)=>sum+value,0)/data.length,level=Math.max(.5,Math.min(2.5,average/42));meterBars.forEach((bar,index)=>{const shape=[.8,1.05,1.3,1.05,.8][index];bar.style.transform=`scaleY(${Math.max(1,level*shape)})`;bar.style.opacity=String(Math.min(1,.45+level/2))});meterFrame=requestAnimationFrame(meterLoop)}
function stopMeter(){if(meterFrame)cancelAnimationFrame(meterFrame);meterFrame=null;meterBars.forEach(bar=>{bar.style.transform='scaleY(1)';bar.style.opacity='.55'});if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}if(audioContext){audioContext.close().catch(()=>{});audioContext=null}analyser=null}
async function start(){if(running){stop();return}if(pageComplete){renderPage()}clearRetryTimer();if(!rec)rec=makeRecognition();if(!rec)return;running=true;listenBtn.textContent='עוצרים הקשבה';listenBtn.classList.add('stop');statusEl.textContent='בוקי מקשיב';statusEl.className='status ok';paint();updateDebug();await startMeter();try{rec.start()}catch(_){statusEl.textContent='לחצו שוב כדי להתחיל'}}
function stop(){running=false;clearRetryTimer();try{rec?.stop()}catch(_){}stopMeter();listenBtn.textContent=pageComplete?'העמוד הושלם':done?'ממשיכים לקרוא':'מתחילים לקרוא';listenBtn.classList.remove('stop');if(!helpBtn.classList.contains('show'))retryIndex=-1;if(!pageComplete&&retryIndex<0)statusEl.textContent=done?'ממשיכים מהמילה המהבהבת':'מתחילים מהמילה המהבהבת';paint();updateDebug()}
function completePage(){if(pageComplete)return;pageComplete=true;done=expected.length;retryIndex=-1;helpBtn.classList.remove('show');stop();storyEl.classList.add('page-complete');celebrationEl.classList.add('show');statusEl.textContent='כל העמוד נקרא!';statusEl.className='status ok';nextBtn.disabled=false;nextBtn.classList.add('ready');burstConfetti();paint()}
function burstConfetti(){confettiEl.innerHTML='';const colors=['#8d63d5','#58c783','#f1c36d','#ff7da6','#6ca9ff','#ffb347'];for(let i=0;i<36;i++){const piece=document.createElement('span');piece.className='confetti-piece';piece.style.left=`${Math.random()*100}%`;piece.style.background=colors[i%colors.length];piece.style.animationDelay=`${Math.random()*220}ms`;piece.style.width=`${8+Math.random()*8}px`;piece.style.height=`${12+Math.random()*12}px`;confettiEl.appendChild(piece)}setTimeout(()=>confettiEl.innerHTML='',1800)}
function helpCurrentWord(){if(done>=expected.length)return;retryIndex=done;helpBtn.classList.add('show');paint();const plain=norm(expected[done]),chunks=HELP_CHUNKS[plain]||expected[done];statusEl.textContent=chunks;statusEl.className='status ok';events.push({time:new Date().toISOString(),type:'help',word:plain,position:done});if('speechSynthesis'in window){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(plain);utterance.lang='he-IL';utterance.rate=.72;speechSynthesis.speak(utterance)}}
function nextPage(){if(nextBtn.disabled)return;if(pageIndex<PAGES.length-1){pageIndex++;stop();renderPage()}else{burstConfetti();celebrationEl.textContent='אלוף! סיימת את כל הסיפור 🎊';celebrationEl.classList.add('show');statusEl.textContent='סיום מושלם';statusEl.className='status ok'}}
listenBtn.onclick=start;helpBtn.onclick=helpCurrentWord;nextBtn.onclick=nextPage;resetBtn.onclick=()=>{stop();renderPage()};copyBtn.onclick=async()=>{const report={createdAt:new Date().toISOString(),device:navigator.userAgent,page:pageIndex+1,progress:`${done}/${expected.length}`,current:done<expected.length?norm(expected[done]):'complete',events},value=JSON.stringify(report,null,2);try{await navigator.clipboard.writeText(value);copyBtn.textContent='הועתק ✓'}catch(_){copyBtn.textContent='לא הצלחתי להעתיק — שלחו צילום'}setTimeout(()=>copyBtn.textContent='העתקת תוצאות הטסט',1800)};
renderPage();
</script>
