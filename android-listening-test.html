<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>בדיקת בוקי לאנדרואיד</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#fff8e7;font-family:Arial,sans-serif;color:#26343c;padding:18px}
    .card{max-width:760px;margin:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 35px #0001}
    h1{text-align:center;font-size:34px;margin:8px 0 12px}
    .sub,.status{text-align:center;font-size:20px;line-height:1.45}
    .words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#faf8f1;border-radius:24px;padding:18px;margin:18px 0}
    .word{font-size:32px;line-height:1.3;padding:8px 11px;border-radius:14px;transition:background .12s,color .12s,transform .12s,outline .12s}
    .word.done{background:#ccefd5;color:#12643b}
    .word.live{background:#eadcff;outline:3px solid #eba63c}
    .word.retry{background:#fff0c7;outline:4px solid #f2994a;animation:retryFlash .55s ease-in-out 3}
    @keyframes retryFlash{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.09);filter:brightness(1.08)}}
    button{width:100%;border:0;border-radius:24px;padding:18px;font-size:27px;font-weight:700;background:#eba63c;color:#225ed2;box-shadow:0 8px 0 #c87d1e}
    button.stop{background:#8f62d6;color:white;box-shadow:0 8px 0 #6b46b0}
    .ok{color:#7c55d0;font-weight:700}
    .retry-text{color:#b35b00;font-weight:700}
    .note{font-size:16px;color:#70777d;text-align:center;line-height:1.4}
    details{margin-top:20px;border-top:1px solid #eee;padding-top:12px;color:#6b7175}
    summary{cursor:pointer;text-align:center;font-weight:700}
    .debug{font-size:15px;line-height:1.55;background:#f7f7f7;border-radius:14px;padding:12px;margin-top:10px;word-break:break-word}
    .copy{margin-top:10px;padding:11px;font-size:16px;border-radius:14px;background:#ece6f9;color:#6545a7;box-shadow:none}
  </style>
</head>
<body>
<main class="card">
  <h1>🎙️ בדיקת בוקי באנדרואיד</h1>
  <p class="sub">בוקי סלחן להגייה, אבל מתקדם רק אחרי ששמע את המילה שעליה הוא עומד.</p>
  <div id="words" class="words"></div>
  <button id="btn">מתחילים לקרוא</button>
  <p id="status" class="status">מחכים להתחלה</p>
  <p class="note">אם מילה לא זוהתה, היא תהבהב ויהיה צריך לומר אותה שוב. המשך המשפט לא יאשר אותה במקומה.</p>

  <details>
    <summary>פרטי טסט למבוגר</summary>
    <div id="debug" class="debug">עדיין אין נתוני בדיקה.</div>
    <button id="copy" class="copy" type="button">העתקת תוצאות הטסט</button>
  </details>
</main>
<script>
const TEXT='בַּבֹּקֶר נֹעַם יָצָא לַגִּנָּה. הוּא רָאָה פַּרְפַּר כָּחֹל עָף מֵעַל הַפְּרָחִים. נֹעַם עָמַד בְּשֶׁקֶט וְחִכָּה שֶׁהַפַּרְפַּר יִתְקָרֵב.';
const expected=TEXT.split(/\s+/).filter(Boolean);
const box=document.getElementById('words');
const btn=document.getElementById('btn');
const status=document.getElementById('status');
const debug=document.getElementById('debug');
const copyBtn=document.getElementById('copy');
let rec=null,running=false,done=0,retryIndex=-1,retries=0;
let lastExpected='',lastHeard='',lastAlternatives=[];
const events=[];

function norm(t){
  const finals={ך:'כ',ם:'מ',ן:'נ',ף:'פ',ץ:'צ'};
  return String(t||'')
    .normalize('NFKD')
    .replace(/[\u0591-\u05C7]/g,'')
    .replace(/[ךםןףץ]/g,c=>finals[c])
    .replace(/["'׳״.,!?;:()\[\]{}־–—/\\]/g,' ')
    .replace(/[^א-ת\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function phonetic(t){
  return norm(t).replace(/ע/g,'א').replace(/[חכ]/g,'כ').replace(/[טת]/g,'ת');
}
function spellingKey(t){
  return phonetic(t).replace(/[וי]/g,'');
}
const PREFIXES=new Set('ובכלמשהאתינ'.split(''));
const SUFFIXES=['יהם','יכן','יכם','יות','ים','ות','יו','יה','נו','כם','כן','ה','ת','ו','י','ך'];

function variants(t){
  const base=norm(t).replace(/\s/g,'');
  const out=new Set([base]);
  let layer=[base];
  for(let depth=0;depth<2;depth++){
    const next=[];
    for(const value of layer){
      if(value.length>3&&PREFIXES.has(value[0])){
        const cut=value.slice(1);
        if(cut.length>=3&&!out.has(cut)){out.add(cut);next.push(cut)}
      }
    }
    layer=next;
  }
  for(const value of [...out]){
    for(const suffix of SUFFIXES){
      if(value.endsWith(suffix)&&value.length-suffix.length>=3){
        out.add(value.slice(0,-suffix.length));
      }
    }
  }
  return [...out];
}
function lev(a,b){
  const r=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let d=r[0];r[0]=i;
    for(let j=1;j<=b.length;j++){
      const u=r[j];
      r[j]=Math.min(r[j]+1,r[j-1]+1,d+(a[i-1]===b[j-1]?0:1));
      d=u;
    }
  }
  return r[b.length];
}
function lcs(a,b){
  const dp=Array(b.length+1).fill(0);
  for(const ca of a){
    let prev=0;
    for(let j=1;j<=b.length;j++){
      const temp=dp[j];
      dp[j]=ca===b[j-1]?prev+1:Math.max(dp[j],dp[j-1]);
      prev=temp;
    }
  }
  return dp[b.length];
}
function sameCore(spoken,written){
  for(const a0 of variants(spoken)){
    for(const b0 of variants(written)){
      const a=phonetic(a0),b=phonetic(b0);
      const ak=spellingKey(a0),bk=spellingKey(b0);
      if(a===b||(ak&&ak===bk))return true;
      const min=Math.min(ak.length,bk.length);
      const max=Math.max(ak.length,bk.length);
      if(min<3)continue;
      const common=lcs(ak,bk);
      const distance=lev(ak,bk);
      if(min===3){
        if(common>=2&&distance<=1&&(ak[0]===bk[0]||ak.at(-1)===bk.at(-1)))return true;
      }else if(common>=3&&common/min>=.72&&distance<=Math.max(1,Math.floor(max*.34))){
        return true;
      }
    }
  }
  return false;
}

function paint(){
  box.innerHTML='';
  expected.forEach((w,i)=>{
    const s=document.createElement('span');
    const classes=['word'];
    if(i<done)classes.push('done');
    else if(i===retryIndex)classes.push('retry');
    else if(i===done&&running)classes.push('live');
    s.className=classes.join(' ');
    s.textContent=w;
    box.appendChild(s);
  });
}
function updateDebug(){
  const current=done<expected.length?expected[done]:'סיום';
  debug.innerHTML=`<strong>המילה הנוכחית:</strong> ${current}<br><strong>שמעתי לאחרונה:</strong> ${lastHeard||'—'}<br><strong>חלופות:</strong> ${lastAlternatives.join(' | ')||'—'}<br><strong>ניסיונות חוזרים במילה:</strong> ${retries}<br><strong>התקדמות:</strong> ${done}/${expected.length}`;
}
function flashRetry(heard){
  if(done>=expected.length)return;
  retries++;
  retryIndex=done;
  lastExpected=expected[done];
  lastHeard=heard||'לא זוהתה מילה';
  status.textContent=`נסה שוב: ${expected[done]}`;
  status.className='status retry-text';
  events.push({time:new Date().toISOString(),type:'retry',expected:norm(expected[done]),heard:norm(heard),position:done,retries});
  paint();
  updateDebug();
  setTimeout(()=>{
    if(retryIndex===done){retryIndex=-1;paint()}
  },1800);
}
function progressAlternative(text,start){
  const heard=norm(text).split(' ').filter(Boolean);
  let p=start;
  const matched=[];
  const missed=[];
  for(const token of heard){
    if(p>=expected.length)break;
    if(sameCore(token,expected[p])){
      matched.push({heard:token,expected:norm(expected[p]),position:p});
      p++;
    }else{
      missed.push(token);
    }
  }
  return {p,matched,missed,heard};
}
function commitResult(alternatives){
  const before=done;
  let best={p:done,matched:[],missed:[],heard:[],text:''};
  for(const text of alternatives){
    const result=progressAlternative(text,done);
    if(result.p>best.p||(result.p===best.p&&result.missed.length<best.missed.length)){
      best={...result,text};
    }
  }
  lastAlternatives=alternatives.map(norm).filter(Boolean);
  lastHeard=norm(best.text||alternatives[0]||'');

  if(best.p>before){
    done=best.p;
    retryIndex=-1;
    retries=0;
    status.textContent=done>=expected.length?'מושלם! בוקי עקב עד סוף הקטע 🎉':'יופי, ממשיכים';
    status.className='status ok';
    events.push({time:new Date().toISOString(),type:'progress',from:before,to:done,heard:lastHeard,matches:best.matched});
    paint();
    updateDebug();
    if(done>=expected.length)stop();
    return;
  }

  if(lastHeard)flashRetry(lastHeard);
}
function makeRec(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){status.textContent='לא נמצאה תמיכה. ודאו שנפתח ב־Chrome מעודכן.';return null}
  const x=new R();
  x.lang='he-IL';
  x.continuous=true;
  x.interimResults=true;
  x.maxAlternatives=5;
  x.onstart=()=>{status.textContent='בוקי מקשיב';status.className='status ok';updateDebug()};
  x.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const result=e.results[i];
      const alternatives=[];
      for(let a=0;a<Math.min(result.length,5);a++){
        const value=String(result[a]?.transcript||'').trim();
        if(value)alternatives.push(value);
      }
      if(!alternatives.length)continue;
      lastAlternatives=alternatives.map(norm);
      lastHeard=norm(alternatives[0]);
      updateDebug();
      if(result.isFinal)commitResult(alternatives);
      else{
        status.textContent='בוקי מקשיב למילה';
        status.className='status ok';
      }
    }
  };
  x.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed')status.textContent='צריך לאשר מיקרופון ל־Chrome.';
    else if(e.error!=='no-speech'&&e.error!=='aborted')status.textContent='הזיהוי נעצר. לחצו שוב והמשיכו.';
  };
  x.onend=()=>{if(running)try{x.start()}catch(_){}};
  return x;
}
function start(){
  if(running){stop();return}
  if(done>=expected.length){done=0;retries=0;retryIndex=-1;events.length=0}
  if(!rec)rec=makeRec();
  if(!rec)return;
  running=true;
  btn.textContent='עוצרים הקשבה';
  btn.classList.add('stop');
  status.textContent='בוקי מקשיב';
  status.className='status ok';
  paint();
  updateDebug();
  try{rec.start()}catch(_){status.textContent='לחצו שוב כדי להתחיל'}
}
function stop(){
  running=false;
  try{rec?.stop()}catch(_){}
  btn.textContent=done>=expected.length?'לקרוא שוב':'ממשיכים לקרוא';
  btn.classList.remove('stop');
  retryIndex=-1;
  paint();
  updateDebug();
}
copyBtn.onclick=async()=>{
  const report={createdAt:new Date().toISOString(),device:navigator.userAgent,progress:`${done}/${expected.length}`,current:done<expected.length?norm(expected[done]):'complete',events};
  const value=JSON.stringify(report,null,2);
  try{await navigator.clipboard.writeText(value);copyBtn.textContent='הועתק ✓'}
  catch(_){copyBtn.textContent='לא הצלחתי להעתיק — שלחו צילום'}
  setTimeout(()=>copyBtn.textContent='העתקת תוצאות הטסט',1800);
};
btn.onclick=start;
paint();
updateDebug();
</script>
</body>
</html>
